services:
  db:
    image: mariadb:11
    container_name: clockwork-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      # Loaded only on first init of an empty data volume.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
    # DB stays on the private network only — never exposed to the proxy or host.
    networks:
      - internal

  clockwork-api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: clockwork-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    volumes:
      # Live-mount source; keep the image's vendor/ via anonymous volume.
      - ./:/var/www/html
      - /var/www/html/vendor
    # On `internal` to reach the DB; on `web-proxy-network` so the shared nginx
    # proxy can route to this container (by name `clockwork-api`, port 80).
    networks:
      - internal
      - web-proxy-network

volumes:
  db_data:

networks:
  internal:
    external: false
  web-proxy-network:
    external: true
